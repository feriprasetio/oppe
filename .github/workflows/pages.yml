name: Deploy OPPE Digital

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required site files
        run: |
          set -euo pipefail
          test -s index.html
          test -s src/styles.css
          test -s src/app.js
          test -f data/professions.json
          echo "Required OPPE frontend files are present."

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for f in src/*.js; do node --check "$f"; done
          python3 -c "import json; d=json.load(open('data/professions.json', encoding='utf-8')); assert len(d) == 49"
          echo "JavaScript syntax and catalogue OK."

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src data _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi
          touch _site/.nojekyll
          cat > _site/404.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Halaman tidak ditemukan — OPPE Digital</title>
          <body style="font:16px Arial,sans-serif;max-width:640px;margin:12vh auto;padding:24px;color:#182230">
            <h1>Halaman tidak ditemukan</h1>
            <p>Halaman yang diminta tidak tersedia.</p>
            <p><a href="./">Kembali ke OPPE Digital</a></p>
          </body>
          </html>
          EOF
          echo "Pages artifact:"
          find _site -maxdepth 3 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Pages site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$PAGES_URL/" -o /tmp/oppe-index.html
          curl --fail --silent --show-error "$PAGES_URL/src/styles.css" -o /tmp/oppe-styles.css
          curl --fail --silent --show-error "$PAGES_URL/src/app.js" -o /tmp/oppe-app.js
          curl --fail --silent --show-error "$PAGES_URL/data/professions.json" -o /tmp/oppe-professions.json
          python3 - <<'PY'
          import json
          with open('/tmp/oppe-professions.json', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data) == 49, f'Expected 49 professions, found {len(data)}'
          indicators = sum(len(p.get('indicators', [])) for p in data)
          assert indicators == 493, f'Expected 493 indicators, found {indicators}'
          print(f'Published catalogue OK: {len(data)} professions / {indicators} indicators')
          PY
          grep -q 'src/styles.css' /tmp/oppe-index.html
          grep -q 'src/app.js' /tmp/oppe-index.html
          echo "Pages URL and all frontend assets respond successfully: $PAGES_URL"
